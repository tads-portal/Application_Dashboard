<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TADS — Internal Application Platform</title>
<meta name="description" content="TADS internal application platform (Phase 1, local-first)." />
<meta name="theme-color" content="#0d4373" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<noscript>TADS requires JavaScript to run. Please enable it in your browser.</noscript>

<div class="app-shell">
  <header class="app-header">
    <div style="display:flex; align-items:center; gap: var(--space-3);">
      <button id="nav-toggle" class="icon-btn nav-toggle" aria-label="Toggle navigation" aria-controls="app-sidebar">
        &#9776;
      </button>
      <div id="header-brand-slot"></div>
    </div>
    <div class="header-right">
      <span id="offline-indicator" class="offline-indicator">Offline</span>
    </div>
  </header>

  <div class="app-body">
    <div id="sidebar-scrim" class="sidebar-scrim"></div>
    <nav id="app-sidebar" class="app-sidebar" aria-label="Main navigation"></nav>
    <main id="app-main" class="app-main" role="main">
      <div class="empty-state">Loading TADS…</div>
    </main>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
